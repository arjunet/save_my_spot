<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    mapboxgl.accessToken = 'YOUR_PUBLIC_MAPBOX_TOKEN';

    // 1. Read URL search parameters (e.g., ?lat=40.7128&lon=-74.0060)
    const urlParams = new URLSearchParams(window.location.search);
    
    // Parse lat/lon from URL, fallback to default if not provided
    const lat = parseFloat(urlParams.get('lat')) || 40.7128;
    const lon = parseFloat(urlParams.get('lon')) || -74.0060;

    // 2. Initialize 3D map centered on the URL coordinates
    // Note: Mapbox uses [longitude, latitude] format
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/standard',
        center: [lon, lat],
        zoom: 16.5,
        pitch: 60,
        bearing: -17.6
    });

    // Add user marker directly on launch
    new mapboxgl.Marker({ color: '#FF0000' })
        .setLngLat([lon, lat])
        .addTo(map);

    // 3. Keep function for live Python updates while app is open
    function setMapCenter(newLat, newLon) {
        map.flyTo({
            center: [newLon, newLat],
            essential: true
        });
    }
</script>
</body>
</html>
